server {
  listen 80;
  # Replace with your server IP(s) or hostname, or use `_` as a catch-all.
  server_name _;

  root /var/www/esp32-dashboard;

  location = /dashboard.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /dashboard.json =404;
  }

  location / {
    return 404;
  }
}
